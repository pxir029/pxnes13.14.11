<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PXPanel {{APP_VERSION}}</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/page-assets/login/style.css">
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">PX</div>
    </div>
    <h1>پی ایکس پنل</h1>
    <p class="ver">v{{APP_VERSION}}</p>

    <div id="setupBox" class="hidden">
      <div class="warn">
        برای نگه‌داشتن داده‌ها روی Railway حتماً Volume با مسیر <code>/data</code> وصل کنید.
      </div>
      <div class="err" id="setupErr"></div>
      <label for="setupPw">رمز عبور پنل</label>
      <input type="password" id="setupPw" placeholder="حداقل ۶ کاراکتر" autocomplete="new-password">
      <label for="setupPw2">تکرار رمز عبور</label>
      <input type="password" id="setupPw2" placeholder="تکرار رمز" autocomplete="new-password">
      <button type="button" id="setupBtn">تنظیم رمز و ورود</button>
    </div>

    <div id="loginBox" class="hidden">
      <div class="err" id="loginErr"></div>
      <form id="loginForm" autocomplete="on">
        <label for="loginUser">نام کاربری ادمین</label>
        <input type="text" id="loginUser" placeholder="خالی = مالک پنل" autocomplete="username">
        <label for="loginPw">رمز عبور</label>
        <input type="password" id="loginPw" placeholder="رمز عبور" autocomplete="current-password" required>
        <button type="submit" id="loginBtn">ورود</button>
      </form>
    </div>
  </div>
  <script src="/page-assets/login/app.js"></script>
</body>
</html>
